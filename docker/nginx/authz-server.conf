# Included in the server while the authz plugin is enabled. @REALM@ is
# replaced with AUTHZ_REALM.

# The subrequest auth_request makes for each catalogue request. Only its
# status matters to nginx. PHP does not see the Authorization header behind
# FastCGI unless it is passed explicitly.
location = /_authz {
    internal;
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_pass_request_body off;
    fastcgi_param CONTENT_LENGTH "";
    fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/Authz/public/verify.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_param ORIGINAL_URI $request_uri;
    fastcgi_param REAL_IP $remote_addr;
    # Fail fast: a stopped PHP should refuse builds, not hang them.
    fastcgi_connect_timeout 2s;
    fastcgi_send_timeout 2s;
    fastcgi_read_timeout 2s;
}

# Always enforces, so the whole chain can be proven while enforcement is off.
# empty_gif and not return: return runs before the access phase, and the
# subrequest would never be made.
location = /_authzcheck {
    auth_request /_authz;
    error_page 401 = @unauthorized;
    add_header Cache-Control "no-store" always;
    empty_gif;
}

# Clears authz's caches in the PHP-FPM pool; guarded by ADMIN_KEY.
location = /_authzpurge {
    include fastcgi_params;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_param SCRIPT_FILENAME /var/www/html/plugins/Authz/public/purge.php;
    fastcgi_param HTTP_X_AUTHZ_ADMIN_KEY $http_x_authz_admin_key;
    fastcgi_param REAL_IP $remote_addr;
}

# A subrequest's own headers never reach the client, so the challenge that
# makes Composer send its credentials is issued here.
location @unauthorized {
    add_header WWW-Authenticate 'Basic realm="@REALM@"' always;
    add_header Cache-Control "no-store" always;
    return 401;
}
