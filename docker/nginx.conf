user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # Written by the entrypoint for the enabled plugins; empty otherwise.
    include /etc/nginx/satisfy/http.conf;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 16m;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        root /var/www/html/public;

        # Written by the entrypoint from TRUSTED_PROXIES: behind those proxies,
        # $remote_addr is the client X-Forwarded-For names, for the logs and authz.
        include /etc/nginx/satisfy/proxy.conf;

        # Written by the entrypoint for the enabled plugins; empty otherwise.
        # catalogue.conf goes in every catalogue location below, server.conf here.
        include /etc/nginx/satisfy/server.conf;

        # The catalogue Satis writes is served as files; PHP never sees it.
        location = /packages.json {
            include /etc/nginx/satisfy/catalogue.conf;
            try_files $uri =404;
        }
        location ^~ /p2/ {
            include /etc/nginx/satisfy/catalogue.conf;
            try_files $uri =404;
        }
        location ^~ /include/ {
            include /etc/nginx/satisfy/catalogue.conf;
            try_files $uri =404;
        }
        location ^~ /dist/ {
            include /etc/nginx/satisfy/catalogue.conf;
            try_files $uri =404;
        }

        # The HTML catalogue, or Satisfy's page saying it has not been built yet.
        location = / {
            include /etc/nginx/satisfy/catalogue.conf;
            try_files /index.html @satisfy;
        }
        location = /index.html {
            include /etc/nginx/satisfy/catalogue.conf;
            try_files $uri =404;
        }

        # The admin UI, its assets, /login and the webhooks.
        location / {
            try_files $uri @satisfy;
        }

        location @satisfy {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            # Symfony gets the address that connected and reads X-Forwarded-For
            # itself, by the same TRUSTED_PROXIES.
            fastcgi_param REMOTE_ADDR $realip_remote_addr;
        }

        # Only the front controller runs, and only through @satisfy.
        location ~ \.php$ {
            return 404;
        }
        location ~ /\. {
            return 404;
        }
    }
}
