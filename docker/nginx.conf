user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    server_tokens off;
    client_max_body_size 16m;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        root /var/www/html/public;

        # The catalogue Satis writes is served as files; PHP never sees it.
        location = /packages.json {
            try_files $uri =404;
        }
        location ^~ /p2/ {
            try_files $uri =404;
        }
        location ^~ /include/ {
            try_files $uri =404;
        }
        location ^~ /dist/ {
            try_files $uri =404;
        }

        # The HTML catalogue, or Satisfy's page saying it has not been built yet.
        location = / {
            try_files /index.html @satisfy;
        }

        # The admin UI, its assets, /login and the webhooks.
        location / {
            try_files $uri @satisfy;
        }

        location @satisfy {
            fastcgi_pass 127.0.0.1:9000;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
        }

        # Only the front controller runs, and only through @satisfy.
        location ~ \.php$ {
            return 404;
        }
        location ~ /\. {
            return 404;
        }
    }
}
