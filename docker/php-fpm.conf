; Loaded after the image's own zz-docker.conf, so these settings win.

[www]
; nginx in the same container is the only client.
listen = 127.0.0.1:9000
; Keep the container's environment: the webhook secrets live there.
clear_env = no
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
; nginx logs every request already.
access.log = /dev/null
