# Development: the image, with this checkout mounted over the application.
# Run `composer install` first; the container uses this checkout's vendor/.
services:
  satisfy:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: satisfy
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - /var/www/.composer
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      # This checkout's public/ is the source; don't copy the image's over it.
      SATISFY_SYNC_PUBLIC: 0
      SATISFY_PLUGINS: ${SATISFY_PLUGINS:-}
      SATISFY_MCP_TOKEN: ${SATISFY_MCP_TOKEN:-}
